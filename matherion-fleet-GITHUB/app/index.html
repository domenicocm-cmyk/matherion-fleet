<!doctype html>
<html lang="it" data-tema="auto">
<head>
<meta charset="utf-8">
<title>Matherion Flotta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Giornaliere, mezzi e scadenze della flotta, dal telefono.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="48x48 32x32 16x16">
<link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">

<style>
/* ============================================================
   SISTEMA DI DESIGN MATHERION
   Colori ricavati dal marchio e verificati per contrasto: ogni coppia
   testo-fondo supera 4,5 in entrambi i temi. Il turchese del logo
   (#52AEC1) resta decorativo: come testo avrebbe contrasto 2,6.
   ============================================================ */
:root {
  --fondo: #F4F8F9; --sup: #FFFFFF; --sup2: #EAF2F4; --linea: #D7E3E6;
  --primo: #15808F; --primo-giu: #0E6B79; --primo-testo: #0E6B79; --su-primo: #FFFFFF;
  --testo: #3D3D3D; --testo2: #5E6B70;
  --ok: #1A6F2E; --att: #8A5A00; --crit: #B3261E;
  --ok-velo: #E6F2E9; --att-velo: #FBF0DC; --crit-velo: #FBE9E7;
  --ombra: 0 1px 3px rgba(16, 40, 46, .10), 0 6px 18px rgba(16, 40, 46, .06);
  --r: 12px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
  color-scheme: light;
}
:root[data-tema="scuro"], :root[data-tema="auto"] {
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="chiaro"]) {
    --fondo: #0B0F10; --sup: #151B1D; --sup2: #1E2629; --linea: #2A3437;
    --primo: #3FC6DC; --primo-giu: #5BD6E8; --primo-testo: #3FC6DC; --su-primo: #0B0F10;
    --testo: #E8EEF0; --testo2: #9FB0B5;
    --ok: #4FC97A; --att: #E3B341; --crit: #F08A80;
    --ok-velo: #12271A; --att-velo: #2B2310; --crit-velo: #2E1917;
    --ombra: 0 1px 3px rgba(0, 0, 0, .5), 0 6px 18px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-tema="scuro"] {
  --fondo: #0B0F10; --sup: #151B1D; --sup2: #1E2629; --linea: #2A3437;
  --primo: #3FC6DC; --primo-giu: #5BD6E8; --primo-testo: #3FC6DC; --su-primo: #0B0F10;
  --testo: #E8EEF0; --testo2: #9FB0B5;
  --ok: #4FC97A; --att: #E3B341; --crit: #F08A80;
  --ok-velo: #12271A; --att-velo: #2B2310; --crit-velo: #2E1917;
  --ombra: 0 1px 3px rgba(0, 0, 0, .5), 0 6px 18px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--fondo); color: var(--testo); font-family: var(--font);
  font-size: 16px; line-height: 1.45; overscroll-behavior-y: none;
}
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- impalcatura ---------- */
.schermo { min-height: 100%; display: flex; flex-direction: column; }
.testata {
  position: sticky; top: 0; z-index: 20; background: var(--sup);
  border-bottom: 1px solid var(--linea);
  padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  display: flex; align-items: center; gap: 12px; min-height: 56px;
}
.testata h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.testata .marchio { height: 28px; width: auto; }
main {
  flex: 1; padding: 16px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
main.senzabarra { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
main.conpollice { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
main.senzabarra.conpollice { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }

/* ---------- barra delle sezioni ---------- */
.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex;
  background: var(--sup); border-top: 1px solid var(--linea);
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  box-shadow: 0 -2px 14px rgba(10, 18, 36, .07);
}
.barra button {
  flex: 1 1 0; min-width: 0; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 2px 6px; border-radius: 10px; color: var(--testo2);
  font-size: 11px; font-weight: 650; line-height: 1.1; position: relative;
}
.barra button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra button.on { color: var(--primo-testo); }
.barra button.on svg { stroke-width: 2.3; }
.barra .bollo {
  position: absolute; top: 2px; left: 50%; margin-left: 4px;
  background: var(--crit); color: #fff; border-radius: 99px;
  font-size: 10px; line-height: 1; padding: 3px 5px; font-weight: 700;
}
:root[data-tema="scuro"] .barra .bollo, :root:not([data-tema="chiaro"]) .barra .bollo { color: #2E1917; }

/* ---------- testo ---------- */
h2 { margin: 0 0 4px; font-size: 26px; font-weight: 680; letter-spacing: -.02em; }
h3 { margin: 0 0 10px; font-size: 15px; font-weight: 650; color: var(--testo2);
  text-transform: uppercase; letter-spacing: .04em; }
.muto { color: var(--testo2); }
.piccolo { font-size: 13px; }

/* ---------- riquadri ---------- */
.riquadri { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 14px 0 22px; }
.riq {
  text-align: left; background: var(--sup); border: 1px solid var(--linea);
  border-left: 4px solid var(--primo); border-radius: var(--r); padding: 14px;
  cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 86px;
  justify-content: center; box-shadow: var(--ombra);
}
.riq b { font-size: 30px; line-height: 1; font-weight: 680; font-variant-numeric: tabular-nums; }
.riq small { color: var(--testo2); font-size: 12.5px; line-height: 1.25; }
.riq.caldo { border-left-color: var(--crit); background: var(--crit-velo); }
.riq.caldo b { color: var(--crit); }
.riq.avviso { border-left-color: var(--att); background: var(--att-velo); }
.riq.avviso b { color: var(--att); }
.riq:active { transform: scale(.985); }

/* ---------- schede ---------- */
.schede { display: flex; flex-direction: column; gap: 10px; }
.scheda {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--sup); border: 1px solid var(--linea); border-left: 4px solid var(--primo);
  border-radius: var(--r); padding: 14px; cursor: pointer; min-height: 68px;
  box-shadow: var(--ombra); color: inherit;
}
.scheda:active { background: var(--sup2); }
.scheda .corpo { flex: 1; min-width: 0; }
.scheda .tit { font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.scheda .sot { color: var(--testo2); font-size: 13.5px; margin-top: 2px; }
.scheda .dett { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 6px; font-size: 13px; color: var(--testo2); }
.scheda .dett b { color: var(--testo); font-weight: 650; }
.scheda.att { border-left-color: var(--att); background: var(--att-velo); }
.scheda.err { border-left-color: var(--crit); background: var(--crit-velo); }
.scheda .frec { color: var(--testo2); flex-shrink: 0; }

/* ---------- comandi ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 20px; border-radius: var(--r);
  border: 1px solid var(--linea); background: var(--sup); color: var(--testo);
  font-weight: 650; cursor: pointer;
}
.btn:active { transform: scale(.98); }
.btn.primo { background: var(--primo); border-color: var(--primo); color: var(--su-primo); }
.btn.primo:active { background: var(--primo-giu); border-color: var(--primo-giu); }
.btn.largo { width: 100%; }
.btn.grande { min-height: 58px; font-size: 17px; }
.btn.pericolo { color: var(--crit); border-color: var(--crit); }
.btn:disabled { opacity: .45; }
.btn.piatto { border: 0; background: none; color: var(--primo-testo); min-height: 44px; padding: 0 8px; }

/* il comando principale della schermata, a portata di pollice */
.pollice {
  position: fixed; left: 16px; right: 16px; z-index: 25;
  left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right));
  bottom: calc(76px + env(safe-area-inset-bottom));
}
main.senzabarra ~ .pollice { bottom: calc(16px + env(safe-area-inset-bottom)); }

/* ---------- campi ---------- */
.campo { margin-bottom: 16px; }
.campo label { display: block; font-size: 13.5px; font-weight: 650; color: var(--testo2); margin-bottom: 6px; }
.inp {
  width: 100%; min-height: 52px; padding: 12px 14px; border-radius: var(--r);
  border: 1px solid var(--linea); background: var(--sup); font-size: 17px;
}
.inp:focus { outline: 2px solid var(--primo); outline-offset: -2px; }
.inp.numero { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 650; }
.aiuto { font-size: 13px; color: var(--testo2); margin-top: 6px; }
.aiuto.allarme { color: var(--att); font-weight: 650; }

/* tacche del carburante */
.tacche { display: flex; gap: 6px; }
.tacche button {
  flex: 1; min-height: 58px; border-radius: var(--r); border: 1px solid var(--linea);
  background: var(--sup); font-weight: 650; font-size: 14px; cursor: pointer; color: var(--testo2);
}
.tacche button.on { background: var(--primo); border-color: var(--primo); color: var(--su-primo); }

/* ---------- foto ---------- */
.foto { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.scatto {
  position: relative; aspect-ratio: 4/3; border-radius: var(--r); overflow: hidden;
  border: 1.5px dashed var(--linea); background: var(--sup); display: flex;
  flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  color: var(--testo2); font-size: 13px; font-weight: 650; cursor: pointer; padding: 8px; text-align: center;
}
.scatto.fatto { border-style: solid; border-color: var(--primo); }
.scatto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scatto .eti {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px;
  background: linear-gradient(transparent, rgba(0, 0, 0, .66)); color: #fff;
  font-size: 12px; font-weight: 650; text-align: left;
}
.scatto .segno { position: absolute; top: 6px; right: 6px; background: var(--primo);
  color: var(--su-primo); border-radius: 99px; width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center; }

/* ---------- passi ---------- */
.passi { display: flex; gap: 6px; margin-bottom: 18px; }
.passi i { flex: 1; height: 4px; border-radius: 99px; background: var(--linea); }
.passi i.on { background: var(--primo); }

/* ---------- striscia della coda ---------- */
.coda {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--att-velo); color: var(--att); border-radius: var(--r);
  font-size: 13.5px; font-weight: 650; margin-bottom: 14px;
}
.coda.serena { background: var(--ok-velo); color: var(--ok); }
.coda button { margin-left: auto; }

/* ---------- targa ---------- */
.targa {
  display: inline-flex; align-items: stretch; height: 26px; border: 1.5px solid #222;
  border-radius: 4px; background: #fff; color: #111; font-weight: 700; font-size: 14px;
  letter-spacing: .08em; overflow: hidden; font-variant-numeric: tabular-nums;
}
.targa i { background: #003399; color: #fff; display: flex; align-items: center;
  padding: 0 3px; font-size: 8px; font-style: normal; font-weight: 700; }
.targa span { padding: 0 7px; display: flex; align-items: center; }

/* ---------- pastiglie ---------- */
.pil { display: inline-block; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; font-weight: 650;
  background: var(--sup2); color: var(--testo2); }
.pil.ok { background: var(--ok-velo); color: var(--ok); }
.pil.att { background: var(--att-velo); color: var(--att); }
.pil.crit { background: var(--crit-velo); color: var(--crit); }

/* ---------- fogli dal basso ---------- */
.velo { position: fixed; inset: 0; z-index: 50; background: rgba(8, 20, 22, .5);
  display: flex; align-items: flex-end; }
.foglio {
  width: 100%; max-height: 88vh; overflow-y: auto; background: var(--sup);
  border-radius: 18px 18px 0 0; padding: 8px 0 calc(12px + env(safe-area-inset-bottom));
  animation: su .2s ease-out;
}
@keyframes su { from { transform: translateY(18px); opacity: .5 } to { transform: none; opacity: 1 } }
.presa { width: 40px; height: 4px; border-radius: 99px; background: var(--linea); margin: 4px auto 12px; }
.foglio h3 { padding: 0 20px; }
.voce { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none;
  padding: 15px 20px; font-size: 16px; text-align: left; cursor: pointer; color: var(--testo); }
.voce:active { background: var(--sup2); }
.voce.on { color: var(--primo-testo); font-weight: 650; background: var(--sup2); }

/* ---------- vuoti e avvisi ---------- */
.vuoto { text-align: center; color: var(--testo2); padding: 36px 18px; background: var(--sup);
  border: 1px dashed var(--linea); border-radius: var(--r); }
.avvisi { position: fixed; left: 12px; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom));
  z-index: 60; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.av { background: #11262A; color: #F2F7F8; border-radius: var(--r); padding: 12px 16px;
  font-size: 14px; box-shadow: var(--ombra); border-left: 4px solid var(--primo); }
.av.male { border-left-color: var(--crit); }

/* ---------- accesso ---------- */
.ingresso { display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 10px; padding: 32px 24px; min-height: 100%; }
.ingresso img { width: 190px; margin-bottom: 8px; }
.ingresso p { color: var(--testo2); max-width: 30ch; margin: 0; }

/* ---------- tablet: non si allarga all'infinito ---------- */
@media (min-width: 700px) {
  main, .testata, .pollice, .avvisi { max-width: 680px; margin-left: auto; margin-right: auto; }
  .pollice { left: 50%; right: auto; transform: translateX(-50%); width: min(680px, calc(100% - 32px)); }
  .riquadri { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .foto { grid-template-columns: repeat(4, 1fr); }
  .foglio { max-width: 680px; margin: 0 auto; border-radius: 18px; margin-bottom: 24px; }
  .velo { align-items: center; padding: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>

/* ---------- fogli dal basso ---------- */
function foglio(titolo, corpo, lega) {
  const v = document.createElement('div'); v.className = 'velo';
  v.innerHTML = `<div class="foglio" role="dialog" aria-modal="true"><div class="presa"></div>
    ${titolo ? `<h3>${esc(titolo)}</h3>` : ''}${corpo}</div>`;
  const chiudi = () => { v.remove(); removeEventListener('keydown', k); };
  const k = e => { if (e.key === 'Escape') chiudi(); };
  addEventListener('keydown', k);
  v.addEventListener('click', e => { if (e.target === v) chiudi(); });
  document.body.appendChild(v);
  if (lega) lega(v, chiudi);
  return chiudi;
}
function conferma(titolo, testo, etichetta = 'Conferma') {
  return new Promise(ok => {
    let fatto = false;
    foglio(titolo, `<p style="padding:0 20px;margin:0 0 16px;color:var(--testo2)">${esc(testo)}</p>
      <div style="padding:0 20px;display:flex;flex-direction:column;gap:8px">
        <button class="btn primo largo" data-si>${esc(etichetta)}</button>
        <button class="btn largo" data-no>Annulla</button></div>`,
      (v, chiudi) => {
        v.querySelector('[data-si]').onclick = () => { fatto = true; chiudi(); ok(true); };
        v.querySelector('[data-no]').onclick = () => { chiudi(); ok(false); };
        v.addEventListener('click', e => { if (e.target === v && !fatto) ok(false); });
      });
  });
}

/* ---------- foto: ridotte prima di partire ---------- */
async function riduci(file, max = 1600, q = 0.72) {
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    bmp.close && bmp.close();
    return b && b.size < file.size ? b : file;
  } catch (e) { return file; }
}

/* ============================================================
   ARCHIVIO LOCALE
   Tre depositi: 'kv' per impostazioni e indice, 'coda' per quello
   che deve ancora partire, 'foto' per i file in attesa.
   ============================================================ */
const DB_NOME = 'matherion-flotta', DB_VER = 1;
const DB = {
  p: null,
  apri() {
    if (this.p) return this.p;
    this.p = new Promise((ok, no) => {
      let r;
      try { r = indexedDB.open(DB_NOME, DB_VER); } catch (e) { return no(e); }
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('coda')) {
          const s = d.createObjectStore('coda', { keyPath: 'id' });
          s.createIndex('prossimo', 'prossimo');
          s.createIndex('stato', 'stato');
        }
        if (!d.objectStoreNames.contains('foto')) d.createObjectStore('foto');
      };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => no(r.error);
    });
    return this.p;
  },
  async tx(dep, modo, fn) {
    const d = await this.apri();
    return new Promise((ok, no) => {
      const t = d.transaction(dep, modo);
      const s = t.objectStore(dep);
      let out;
      try { out = fn(s); } catch (e) { return no(e); }
      // una chiave assente dà result undefined: va restituito undefined,
      // non la richiesta stessa, che non è clonabile e finirebbe nei dati
      t.oncomplete = () => ok(out instanceof IDBRequest ? out.result : out);
      t.onerror = () => no(t.error);
      t.onabort = () => no(t.error);
    });
  },
  get(dep, k) { return this.tx(dep, 'readonly', s => s.get(k)); },
  set(dep, k, v) { return this.tx(dep, 'readwrite', s => (dep === 'coda' ? s.put(v) : s.put(v, k))); },
  del(dep, k) { return this.tx(dep, 'readwrite', s => s.delete(k)); },
  tutti(dep) { return this.tx(dep, 'readonly', s => s.getAll()); },
  async svuota(dep) { return this.tx(dep, 'readwrite', s => s.clear()); },
};

/* ============================================================
   CODA DI INVIO
   Regola unica dell'applicazione: niente va perso in silenzio.
   Quello che l'utente registra viene scritto subito nell'archivio
   locale e mostrato come fatto; l'invio avviene quando può.
   ============================================================ */
const ATTESE = [10e3, 30e3, 120e3, 600e3, 1800e3];   // 10s, 30s, 2m, 10m, 30m
const RESA = 48 * 3600e3;                            // dopo due giorni smette di ritentare da sola
const PRIORITA = { giornaliera: 0, segnalazione: 0, manutenzione: 0, foto: 1 };

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

const CODA = {
  trasporto: null,          // iniettato: { async invia(op) }
  inCorso: false,
  ascoltatori: new Set(),

  su(fn) { this.ascoltatori.add(fn); return () => this.ascoltatori.delete(fn); },
  avvisa() { for (const f of this.ascoltatori) { try { f(); } catch (e) { } } },

  /* Mette in coda. `blob` opzionale: il file viaggia a parte, così il
     record resta leggero e l'invio può ritentare senza ricaricarlo. */
  async accoda(tipo, dati, blob) {
    const op = {
      id: uid(), tipo, dati,
      chiave: dati && dati.codice ? tipo + ':' + dati.codice : null,
      stato: 'attesa', tentativi: 0, prossimo: 0,
      creata: Date.now(), errore: '', priorita: PRIORITA[tipo] ?? 0,
      conFile: !!blob,
    };
    if (blob) await DB.set('foto', op.id, blob);
    await DB.set('coda', op.id, op);
    this.avvisa();
    this.elabora();            // tentativo immediato, senza aspettare
    return op.id;
  },

  async elenco() {
    const l = await DB.tutti('coda');
    return l.sort((a, b) => (a.priorita - b.priorita) || (a.creata - b.creata));
  },

  async stato() {
    const l = await this.elenco();
    return {
      totale: l.length,
      attesa: l.filter(o => o.stato === 'attesa').length,
      bloccate: l.filter(o => o.stato === 'bloccata').length,
      foto: l.filter(o => o.tipo === 'foto').length,
      prossimo: l.reduce((m, o) => (o.prossimo && (!m || o.prossimo < m)) ? o.prossimo : m, 0),
    };
  },

  /* Scorre la coda e tenta quello che è pronto. Una sola alla volta:
     l'ordine conta, perché una foto non può precedere la sua giornaliera. */
  async elabora({ forza = false } = {}) {
    if (this.inCorso) return;
    if (!this.trasporto) return;
    if (!forza && typeof navigator !== 'undefined' && navigator.onLine === false) return;
    this.inCorso = true;
    try {
      const ora = Date.now();
      for (const op of await this.elenco()) {
        if (op.stato === 'bloccata' && !forza) continue;
        // ferma da più di due giorni: lo dichiara subito, senza aspettare
        // la prossima finestra di tentativo, così l'utente lo vede
        if (!forza && Date.now() - op.creata > RESA) {
          await this.chiudi(op, op.errore || 'in attesa da più di due giorni');
          continue;
        }
        if (!forza && op.prossimo > ora) continue;
        await this.tenta(op, forza);
      }
    } finally {
      this.inCorso = false;
      this.avvisa();
    }
  },

  async tenta(op, forza) {
    let blob = null;
    if (op.conFile) {
      blob = await DB.get('foto', op.id);
      if (!blob) {                       // il file non c'è più: inutile insistere
        await this.chiudi(op, 'file non più disponibile sul dispositivo');
        return;
      }
    }
    try {
      await this.trasporto.invia(op, blob);
      await DB.del('coda', op.id);
      if (op.conFile) await DB.del('foto', op.id);
    } catch (e) {
      op.tentativi++;
      op.errore = (e && e.message) || 'invio non riuscito';
      const scaduta = Date.now() - op.creata > RESA;
      op.stato = (scaduta && !forza) ? 'bloccata' : 'attesa';
      op.prossimo = Date.now() + (ATTESE[Math.min(op.tentativi - 1, ATTESE.length - 1)]);
      await DB.set('coda', op.id, op);
    }
  },

  async chiudi(op, perche) {
    op.stato = 'bloccata'; op.errore = perche;
    await DB.set('coda', op.id, op);
  },

  /* L'utente chiede di riprovare adesso: azzera le attese e insiste. */
  async riprova() {
    for (const op of await this.elenco()) {
      op.stato = 'attesa'; op.prossimo = 0;
      await DB.set('coda', op.id, op);
    }
    await this.elabora({ forza: true });
  },

  async scarta(id) {
    await DB.del('coda', id);
    await DB.del('foto', id).catch(() => { });
    this.avvisa();
  },
};

/* Il battito: ritenta da sola, e appena torna la rete. */
let battito = null;
function avviaCoda(trasporto) {
  CODA.trasporto = trasporto;
  clearInterval(battito);
  battito = setInterval(() => CODA.elabora(), 20e3);
  addEventListener('online', () => CODA.elabora());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) CODA.elabora(); });
  CODA.elabora();
}

/* ============================================================
   ACCESSO CON ACCOUNT MICROSOFT
   Authorization code con PKCE, scritto a mano: nessuna libreria da
   scaricare, nessun segreto dentro l'app. Stesso flusso del gestionale.
   ============================================================ */
const AMBITO = 'openid profile email offline_access User.Read Files.ReadWrite.All Sites.ReadWrite.All';
const CH_SESSIONE = 'mf-sessione';
const b64url = b => btoa(String.fromCharCode(...new Uint8Array(b)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const casuale = (n = 48) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a).slice(0, n); };
const ritorno = () => location.origin + location.pathname;

const MS = { cfg: undefined, tok: null, io: null };

async function msConfig() {
  if (MS.cfg !== undefined) return MS.cfg;
  let c = null;
  try { c = JSON.parse(localStorage.getItem('mf-config') || 'null'); } catch (e) { }
  if (!c && /^https?:$/.test(location.protocol)) {
    // accanto all'app, oppure quello del gestionale un livello sopra:
    // così la configurazione si scrive una volta sola
    for (const u of ['config.json', '../config.json']) {
      try { const r = await fetch(u, { cache: 'no-store' }); if (r.ok) { c = await r.json(); break; } } catch (e) { }
    }
  }
  MS.cfg = (c && c.clientId && c.tenantId) ? c : null;
  return MS.cfg;
}
const msAttivo = () => !!MS.cfg;
const msUrl = (c, p) => `https://login.microsoftonline.com/${encodeURIComponent(c.tenantId)}/oauth2/v2.0/${p}`;

async function msAccedi() {
  const c = await msConfig(); if (!c) return;
  const ver = casuale(64), st = casuale(24);
  const sfida = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ver)));
  try { sessionStorage.setItem('mf-pkce', JSON.stringify({ ver, st })); }
  catch (e) { return avviso('Il browser blocca la memoria di sessione: l’accesso non può partire.'); }
  location.assign(msUrl(c, 'authorize') + '?' + new URLSearchParams({
    client_id: c.clientId, response_type: 'code', redirect_uri: ritorno(),
    response_mode: 'query', scope: AMBITO, state: st,
    code_challenge: sfida, code_challenge_method: 'S256',
  }));
}

async function msScambia(corpo) {
  const c = await msConfig();
  const r = await fetch(msUrl(c, 'token'), {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: c.clientId, scope: AMBITO, ...corpo }),
  });
  const j = await r.json();
  if (!r.ok || !j.access_token) throw new Error(j.error_description || j.error || 'accesso non riuscito');
  MS.tok = {
    at: j.access_token, rt: j.refresh_token || (MS.tok && MS.tok.rt) || '',
    scade: Date.now() + (+j.expires_in || 3600) * 1000,
  };
  try { localStorage.setItem(CH_SESSIONE, JSON.stringify(MS.tok)); } catch (e) { }
  return MS.tok;
}

async function msToken() {
  if (!MS.tok) { try { MS.tok = JSON.parse(localStorage.getItem(CH_SESSIONE) || 'null'); } catch (e) { } }
  if (!MS.tok) return '';
  if (Date.now() < MS.tok.scade - 120000) return MS.tok.at;
  if (!MS.tok.rt) { msScaduto(); return ''; }
  try { return (await msScambia({ grant_type: 'refresh_token', refresh_token: MS.tok.rt })).at; }
  catch (e) { msScaduto(); return ''; }
}
function msScaduto() {
  MS.tok = null; try { localStorage.removeItem(CH_SESSIONE); } catch (e) { }
  if (S.io) { S.io = null; S.scaduta = true; disegna(); }
}
async function msEsci() {
  const c = await msConfig();
  MS.tok = null; S.io = null;
  try { localStorage.removeItem(CH_SESSIONE); } catch (e) { }
  if (c) location.assign(msUrl(c, 'logout') + '?post_logout_redirect_uri=' + encodeURIComponent(ritorno()));
  else location.reload();
}

async function msChiSono() {
  const t = await msToken(); if (!t) return null;
  const r = await fetch('https://graph.microsoft.com/v1.0/me?$select=displayName,mail,userPrincipalName',
    { headers: { Authorization: 'Bearer ' + t } });
  if (!r.ok) return null;
  const j = await r.json();
  return { email: j.mail || j.userPrincipalName || '', nome: j.displayName || '' };
}

/* All'avvio: raccoglie il codice di ritorno, oppure riprende la sessione.
   Se non c'è rete ma la sessione è salvata, si entra lo stesso: l'app
   deve aprirsi in un'autorimessa senza segnale. */
async function msAvvio() {
  const c = await msConfig(); if (!c) return false;
  const q = new URLSearchParams(location.search);
  if (q.get('error')) {
    avviso('Accesso non riuscito: ' + (q.get('error_description') || q.get('error')));
    history.replaceState({}, '', ritorno());
  } else if (q.get('code')) {
    let p = null; try { p = JSON.parse(sessionStorage.getItem('mf-pkce') || 'null'); } catch (e) { }
    history.replaceState({}, '', ritorno());
    if (p && p.st === q.get('state')) {
      try { await msScambia({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: ritorno(), code_verifier: p.ver }); }
      catch (e) { avviso('Accesso non riuscito: ' + e.message); }
    } else avviso('Accesso non riuscito: la richiesta non corrisponde. Riprova.');
    try { sessionStorage.removeItem('mf-pkce'); } catch (e) { }
  }
  let io = null;
  try { io = await msChiSono(); } catch (e) { }
  if (!io) io = await DB.get('kv', 'io').catch(() => null);   // ultima identità nota, per l'uso senza rete
  if (io) { S.io = io; await DB.set('kv', 'io', io); }
  return !!io;
}

/* ============================================================
   DEPOSITO SU SHAREPOINT
   Il telefono non apre mai il registro Excel. Legge un indice leggero
   che il gestionale pubblica, e deposita quello che registra come file
   singoli in una cartella: un file per record, scritto una volta sola.
   Niente concorrenza, niente megabyte sulla rete mobile.
   ============================================================ */
const GRAPH = 'https://graph.microsoft.com/v1.0';

async function gFetch(u, opt = {}) {
  const t = await msToken();
  if (!t) throw new Error('sessione non valida');
  const r = await fetch(/^https?:/.test(u) ? u : GRAPH + u,
    { ...opt, headers: { Authorization: 'Bearer ' + t, ...(opt.headers || {}) } });
  if (r.status === 401) { msScaduto(); throw new Error('accesso non più valido'); }
  if (!r.ok) {
    let m = ''; try { const j = await r.json(); m = (j.error && (j.error.message || j.error.code)) || ''; } catch (e) { }
    throw Object.assign(new Error(m || ('SharePoint ha risposto ' + r.status)), { status: r.status });
  }
  return r;
}
const gJson = async (u, o) => (await gFetch(u, o)).json();
const seg = n => encodeURIComponent(n).replace(/'/g, "''");

/* Risolve una volta sola la cartella App dentro la raccolta configurata. */
let _radice = null;
async function radice() {
  if (_radice) return _radice;
  const c = await msConfig(); const sp = (c && c.sharepoint) || {};
  if (!sp.host || !sp.sito) throw new Error('collegamento a SharePoint non configurato');
  const sito = await gJson(`/sites/${sp.host}:${String(sp.sito).replace(/\/$/, '')}`);
  const racc = (await gJson(`/sites/${sito.id}/drives?$select=id,name`)).value || [];
  const dr = (sp.raccolta && racc.find(d => d.name === sp.raccolta)) || racc[0];
  if (!dr) throw new Error('nessuna raccolta documenti nel sito');
  let id = (await gJson(`/drives/${dr.id}/root?$select=id`)).id;
  const parti = String(sp.cartella || '').split('/').filter(Boolean).concat('App');
  for (const p of parti) id = (await cartella(dr.id, id, p)).id;
  _radice = { drive: dr.id, app: id };
  return _radice;
}
async function figlio(drive, padre, nome) {
  try { return await gJson(`/drives/${drive}/items/${padre}:/${seg(nome)}`); }
  catch (e) { if (e.status === 404) return null; throw e; }
}
async function cartella(drive, padre, nome) {
  const it = await figlio(drive, padre, nome);
  if (it) return it;
  return gJson(`/drives/${drive}/items/${padre}/children`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: nome, folder: {}, '@microsoft.graph.conflictBehavior': 'replace' }),
  });
}
async function scrivi(drive, padre, nome, blob) {
  return gJson(`/drives/${drive}/items/${padre}:/${seg(nome)}:/content`,
    { method: 'PUT', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob });
}

/* ---------- l'indice che il gestionale pubblica ---------- */
async function scaricaIndice() {
  const { drive, app } = await radice();
  const it = await figlio(drive, app, 'indice.json');
  if (!it) throw new Error('il gestionale non ha ancora pubblicato l’indice');
  const j = await (await gFetch(`/drives/${drive}/items/${it.id}/content`)).json();
  j.scaricato = Date.now();
  await DB.set('kv', 'indice', j);
  return j;
}
async function indiceLocale() {
  return (await DB.get('kv', 'indice').catch(() => null)) || null;
}

/* ---------- il trasporto che la coda usa ---------- */
const DEPOSITO = {
  async invia(op, blob) {
    const { drive, app } = await radice();
    const posta = await cartella(drive, app, 'Posta');
    const giorno = await cartella(drive, posta.id, (op.dati && op.dati.data) || oggiISO());
    if (op.tipo === 'foto') {
      await scrivi(drive, giorno.id, op.dati.file, blob);
      return;
    }
    const corpo = JSON.stringify({ ...op.dati, _tipo: op.tipo, _op: op.id, _inviata: new Date().toISOString() }, null, 1);
    // il nome del file è il riferimento generato dal telefono: il codice
    // definitivo lo assegna il gestionale quando riversa nel registro
    await scrivi(drive, giorno.id, op.dati.rif + '.json',
      new Blob([corpo], { type: 'application/json' }));
  },
};

/* ============================================================
   MODELLO
   Tutto nasce dall'indice che il gestionale pubblica, più le
   giornaliere che questo telefono ha registrato.
   ============================================================ */
const RUOLI = {
  autista:  { l: 'Autista',        tab: ['oggi', 'mezzi', 'altro'] },
  filiale:  { l: 'Filiale',        tab: ['oggi', 'giornata', 'mezzi', 'altro'] },
  officina: { l: 'Officina',       tab: ['oggi', 'officina', 'mezzi', 'altro'] },
  master:   { l: 'Master',         tab: ['oggi', 'giornata', 'mezzi', 'altro'] },
  lettura:  { l: 'Sola lettura',   tab: ['oggi', 'mezzi', 'altro'] },
};
const ETICH = { master: 'master', filiale: 'filiale', officina: 'officina', 'sola lettura': 'lettura', autista: 'autista' };
const pariEmail = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();

const I = () => S.indice || { mezzi: [], dip: [], ass: [], utenti: [], cdc: [] };

/* Chi sono: prima l'elenco utenti del registro, poi l'anagrafica
   dipendenti. Un autista non va registrato due volte. */
function mioUtente() {
  if (!S.io) return null;
  return (I().utenti || []).find(u => pariEmail(u.e, S.io.email) && u.a !== false) || null;
}
function mioDip() {
  if (!S.io) return null;
  return (I().dip || []).find(d => pariEmail(d.em, S.io.email) && d.att !== false) || null;
}
function ruolo() {
  if (!S.io) return 'ospite';
  if (!S.indice) return 'attesa';
  const u = mioUtente();
  if (u) return ETICH[String(u.r || '').toLowerCase()] || 'lettura';
  return mioDip() ? 'autista' : 'ospite';
}
const defRuolo = () => RUOLI[ruolo()] || null;
function mioCdc() {
  const u = mioUtente(); if (u && u.cdc) return u.cdc;
  const d = mioDip(); return d ? (d.cdc || '') : '';
}
const soloMio = () => ruolo() === 'autista';
const puoScrivere = () => !['lettura', 'ospite', 'attesa'].includes(ruolo());

/* ---------- mezzi ---------- */
function mezziVisti() {
  const l = I().mezzi || [];
  if (soloMio()) { const m = mioMezzo(); return m ? [m] : []; }
  const c = mioCdc();
  return (ruolo() === 'filiale' && c) ? l.filter(m => m.cdc === c) : l;
}
const mezzo = t => (I().mezzi || []).find(m => m.t === t) || null;
function mioMezzo() {
  const d = mioDip(); if (!d) return null;
  const o = oggiISO();
  const a = (I().ass || []).find(x => x.d === d.c && x.dal <= o && (!x.al || x.al >= o));
  return a ? mezzo(a.t) : null;
}
const nomeMezzo = m => m ? [m.ma, m.mo].filter(Boolean).join(' ') : '';

/* ---------- dipendenti ---------- */
function dipVisti() {
  const l = I().dip || [];
  if (soloMio()) { const d = mioDip(); return d ? [d] : []; }
  const c = mioCdc();
  return (ruolo() === 'filiale' && c) ? l.filter(d => d.cdc === c) : l;
}
const dipDi = c => (I().dip || []).find(d => d.c === c) || null;

/* ---------- scadenze ---------- */
const VOCI_SC = { rev: 'Revisione', bol: 'Bollo', rca: 'Polizza RCA', tac: 'Revisione tachigrafo', atp: 'Certificato ATP' };
function scadenze() {
  const out = [];
  for (const m of mezziVisti()) {
    for (const [k, l] of Object.entries(VOCI_SC)) {
      const d = m.sc && m.sc[k]; if (!d) continue;
      const g = giorniA(d);
      out.push({ targa: m.t, titolo: l, data: d, giorni: g, liv: g < 0 ? 'scaduta' : g <= 7 ? 'vicina' : g <= 30 ? 'prossima' : 'lontana' });
    }
  }
  return out.sort((a, b) => a.data < b.data ? -1 : 1);
}
const daGestire = () => scadenze().filter(s => s.liv === 'scaduta' || s.liv === 'vicina');

/* ---------- giornaliere di questo telefono ---------- */

const gioAperta = g => !!g && g.stato === 'Aperta';

/* Mette in coda la giornaliera. Si può chiamare più volte: il

/* ============================================================
   SCHERMATE
   ============================================================ */
const app = () => $('#app');

function disegna() {
  if (!msAttivo()) return vConfig();
  if (!S.io) return vIngresso();
  const r = ruolo();
  if (r === 'attesa') return vAttesa();
  if (r === 'ospite') return vNonAbilitato();
  if (S.vista) {
    const f = { apertura: vApertura, chiusura: vChiusura, mezzo: vMezzo, danno: vDanno }[S.vista.n];
    if (f) return f();
  }
  const t = defRuolo().tab;
  if (!t.includes(S.tab) && S.tab !== 'scadenze') S.tab = 'oggi';
  ({ oggi: vOggi, giornata: vGiornata, mezzi: vMezzi, officina: vOfficina, scadenze: vScadenze }[S.tab] || vOggi)();

/* ---------- impalcature ---------- */

function guscio(titolo, corpo, { indietro, azione, senzaBarra } = {}) {

function barra() {

/* ---------- Oggi ---------- */
async function vOggi() {
  const st = await CODA.stato();
  const r = ruolo(), o = oggiISO();
  const g = miaGio(o);
  const mm = mioMezzo();
  const sc = daGestire();
  const ora = new Date().getHours();
  const salve = ora < 13 ? 'Buongiorno' : ora < 18 ? 'Buon pomeriggio' : 'Buonasera';
  const nome = (S.io.nome || '').split(' ')[0];

  const miei = soloMio();
  const gioOggi = S.gio.filter(x => x.data === o && (!miei || x.dipendente === (mioDip() || {}).c));
  const aperte = gioOggi.filter(gioAperta).length;
  const fermi = (I().mezzi || []).filter(m => m.st === 'Fermo tecnico').length;

  const riq = miei
    ? [[g ? (gioAperta(g) ? 'in corso' : 'chiusa') : '—', 'la mia giornata', gioAperta(g) ? 'avviso' : '', 'oggi'],
       [sc.length, 'scadenze del mio mezzo', sc.length ? 'caldo' : '', 'scadenze'],
       [mm ? mm.t : '—', 'mezzo assegnato', '', 'mezzi'],
       [st.totale, 'cose da inviare', st.bloccate ? 'caldo' : '', 'oggi']]
    : [[aperte, 'giornate aperte', aperte ? 'avviso' : '', 'giornata'],
       [sc.length, 'scadenze da gestire', sc.filter(x => x.liv === 'scaduta').length ? 'caldo' : '', 'scadenze'],
       [fermi, 'veicoli fermi', fermi ? 'caldo' : '', 'officina'],
       [mezziVisti().length, 'mezzi', '', 'mezzi']];

  guscio('Flotta', `
    ${strisciaCoda(st)}
    <h2>${esc(salve)}${nome ? ', ' + esc(nome) : ''}</h2>
    <p class="muto piccolo">${new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' })}${mioCdc() ? ' · ' + esc(mioCdc()) : ''}</p>
    <div class="riquadri">${riq.map(([v, l, c, t]) =>
      `<button class="riq ${c}" data-va="${t}"><b>${esc(String(v))}</b><small>${esc(l)}</small></button>`).join('')}</div>
    ${miei ? schedaMiaGiornata(g, mm) : ''}
    ${sc.length ? `<h3>Da gestire</h3><div class="schede">${sc.slice(0, 5).map(s =>
      `<button class="scheda ${s.liv === 'scaduta' ? 'err' : 'att'}" data-mz="${esc(s.targa)}"><span class="corpo">
        <span class="tit">${esc(s.titolo)} ${targa(s.targa)}</span>
        <span class="dett"><span><b>${fmtD(s.data)}</b></span><span>${s.giorni < 0 ? 'scaduta da ' + (-s.giorni) + ' gg' : 'fra ' + s.giorni + ' gg'}</span></span>
      </span><span class="frec">${ico('avanti', 20)}</span></button>`).join('')}</div>` : ''}
  `);
  if (miei && puoScrivere()) {
    const az = !g ? ['Apri la giornata', 'apertura'] : gioAperta(g) ? ['Chiudi la giornata', 'chiusura'] : null;
    if (az) pollice(`<button class="btn primo grande largo" data-az>${az[0]}</button>`,
                    () => apriPasso(az[1], g));
  }
  legaCoda();
  app().querySelectorAll('[data-va]').forEach(b => b.onclick = () => {
    const t = b.dataset.va;
    if (t === 'scadenze') { S.tab = 'scadenze'; } else if (defRuolo().tab.includes(t)) S.tab = t;
    disegna(); scrollTo(0, 0);
  });
  app().querySelectorAll('[data-mz]').forEach(b => b.onclick = () => { S.vista = { n: 'mezzo', t: b.dataset.mz }; disegna(); });

function schedaMiaGiornata(g, mm) {
  if (!g) return `<div class="vuoto">${ico('giornata', 30)}
    <p style="margin:8px 0 0">La giornata non è ancora aperta.</p>
    ${mm ? `<p class="piccolo">Mezzo assegnato: ${targa(mm.t)} ${esc(nomeMezzo(mm))}</p>` : '<p class="piccolo">Nessun mezzo assegnato oggi.</p>'}</div>`;
  const km = kmFatti(g);
  return `<h3>La mia giornata</h3><div class="schede"><div class="scheda ${g.danni === 'Sì' ? 'err' : gioAperta(g) ? 'att' : ''}">
    <span class="corpo"><span class="tit">${g.targa ? targa(g.targa) : 'senza mezzo'} ${gioAperta(g) ? '<span class="pil att">in corso</span>' : '<span class="pil ok">chiusa</span>'}</span>
    <span class="dett"><span>dalle <b>${esc(g.oraInizio || '—')}</b></span>${g.oraFine ? `<span>alle <b>${esc(g.oraFine)}</b></span>` : ''}
      ${km != null ? `<span><b>${n0.format(km)}</b> km</span>` : ''}
      ${(g.foto || []).length ? `<span>${g.foto.length} foto</span>` : ''}</span></span></div></div>`;
}

/* ---------- apertura e chiusura ---------- */
function apriPasso(n, g) {
  if (n === 'apertura') {
    const d = mioDip(); const mm = mioMezzo();
    const nuova = nuovaGio(d.c, mm ? mm.t : '');
    const prec = S.gio.filter(x => x.targa === nuova.targa && x.kmFine !== '' && x.kmFine != null)
      .sort((a, b) => a.data < b.data ? 1 : -1)[0];
    nuova.kmInizio = prec ? prec.kmFine : (mm && mm.km != null ? mm.km : '');
    S.vista = { n: 'apertura', passo: 1, g: nuova, propKm: nuova.kmInizio };
  } else {
    S.vista = { n: 'chiusura', passo: 1, g: { ...g }, propKm: g.kmInizio };
  }
  disegna();
}
const CARB = ['Riserva', '1/4', '1/2', '3/4', 'Pieno'];
const SLOT = [['anteriore', 'Anteriore'], ['posteriore', 'Posteriore'], ['lato', 'Lato guida'], ['contakm', 'Contachilometri']];

function vApertura() { passoGio('apertura'); }
function vChiusura() { passoGio('chiusura'); }

function passoGio(modo) {
  const v = S.vista, g = v.g, ap = modo === 'apertura';
  const tot = 3;
  const tit = ap ? 'Apri la giornata' : 'Chiudi la giornata';
  const kmK = ap ? 'kmInizio' : 'kmFine', carbK = ap ? 'carbInizio' : 'carbFine';
  const m = mezzo(g.targa);
  let corpo = `<div class="passi">${[1, 2, 3].map(i => `<i class="${i <= v.passo ? 'on' : ''}"></i>`).join('')}</div>`;

  if (v.passo === 1) {
    const prop = ap ? v.propKm : g.kmInizio;
    corpo += `
      <h2>${ap ? 'Mezzo e chilometri' : 'Chilometri finali'}</h2>
      <p class="muto piccolo">${m ? esc(nomeMezzo(m)) : 'nessun mezzo assegnato'}</p>
      <div class="campo" style="margin-top:18px">
        <label>Mezzo</label>
        <select class="inp" data-c="targa">
          <option value="">Giornata senza mezzo</option>
          ${(I().mezzi || []).map(x => `<option value="${esc(x.t)}" ${x.t === g.targa ? 'selected' : ''}>${esc(x.t)} — ${esc(nomeMezzo(x))}</option>`).join('')}
        </select>
      </div>
      <div class="campo">
        <label>Chilometri ${ap ? 'all’inizio' : 'alla fine'}</label>
        <input class="inp numero" type="number" inputmode="numeric" data-c="${kmK}" value="${esc(g[kmK] ?? '')}">
        <div class="aiuto" data-km>${prop !== '' && prop != null ? 'Ultimo valore noto: ' + n0.format(prop) + ' km' : ''}</div>
      </div>
      ${ap ? '' : `<div class="campo"><label>Ora di fine</label>
        <input class="inp" type="time" data-c="oraFine" value="${esc(g.oraFine || oraOra())}"></div>`}`;
  }

  if (v.passo === 2) {
    corpo += `<h2>${ap ? 'Stato alla consegna' : 'Stato alla riconsegna'}</h2>
      <div class="campo" style="margin-top:18px"><label>Carburante</label>
        <div class="tacche">${CARB.map(c => `<button data-carb="${esc(c)}" class="${g[carbK] === c ? 'on' : ''}">${esc(c)}</button>`).join('')}</div>
      </div>
      ${ap ? '' : `
      <div class="campo"><label>Rifornimento</label>
        <div class="tacche">${['No', 'Sì'].map(x => `<button data-rif="${x}" class="${g.rifornimento === x ? 'on' : ''}">${x}</button>`).join('')}</div>
      </div>
      <div data-blocco-rif style="${g.rifornimento === 'Sì' ? '' : 'display:none'}">
        <div class="campo"><label>Litri</label><input class="inp numero" type="number" inputmode="decimal" data-c="litri" value="${esc(g.litri ?? '')}"></div>
        <div class="campo"><label>Importo in euro</label><input class="inp numero" type="number" inputmode="decimal" data-c="importoCarb" value="${esc(g.importoCarb ?? '')}"></div>
      </div>`}
      <div class="campo"><label>Note</label>
        <textarea class="inp" rows="3" data-c="note">${esc(g.note || '')}</textarea></div>
      ${ap ? '' : `<button class="btn pericolo largo" data-danno>${ico('danno', 20)} Segnala un danno</button>`}`;
  }

  if (v.passo === 3) {
    corpo += `<h2>Foto</h2>
      <p class="muto piccolo">Inquadra il mezzo, non le persone.</p>
      <div class="foto" style="margin-top:16px">${SLOT.map(([k, l]) => {
        const f = (g.foto || []).find(x => x.eti === l);
        return `<button class="scatto ${f ? 'fatto' : ''}" data-slot="${k}" data-eti="${esc(l)}">
          ${f ? `<img data-ant="${esc(f.file)}" alt=""><span class="eti">${esc(l)}</span><span class="segno">${ico('spunta', 14)}</span>`
             : `${ico('foto', 26)}<span>${esc(l)}</span>`}</button>`;
      }).join('')}</div>
      <button class="btn largo" data-altra style="margin-top:12px">${ico('foto', 20)} Aggiungi un’altra foto</button>
      <input type="file" accept="image/*" capture="environment" id="scatta" hidden>`;
  }

  guscio(tit, corpo, { indietro: true, senzaBarra: true });
  const d = pollice(`<button class="btn primo grande largo" data-avanti>${v.passo < tot ? 'Avanti' : (ap ? 'Apri la giornata' : 'Chiudi la giornata')}</button>`);

  /* raccolta dei valori */
  app().querySelectorAll('[data-c]').forEach(e => e.oninput = e.onchange = () => {
    const k = e.dataset.c; g[k] = e.value;
    if (k === 'targa') { const x = mezzo(e.value); if (x && ap && (g.kmInizio === '' || g.kmInizio == null)) g.kmInizio = x.km ?? ''; }
    if (k === kmK) controllaKm();
  });
  app().querySelectorAll('[data-carb]').forEach(b => b.onclick = () => {
    g[carbK] = b.dataset.carb; passoGio(modo);
  });
  app().querySelectorAll('[data-rif]').forEach(b => b.onclick = () => { g.rifornimento = b.dataset.rif; passoGio(modo); });
  const bd = app().querySelector('[data-danno]'); if (bd) bd.onclick = () => { S.vista = { n: 'danno', g, torna: modo }; disegna(); };

  function controllaKm() {
    const el = app().querySelector('[data-km]'); if (!el) return;
    const val = +g[kmK], rif = +(ap ? v.propKm : g.kmInizio);
    el.className = 'aiuto';
    if (!val || isNaN(rif)) return;
    if (val < rif) { el.className = 'aiuto allarme'; el.textContent = `Meno dei ${n0.format(rif)} km dell’ultima lettura: è giusto?`; }
    else if (val - rif > 1500) { el.className = 'aiuto allarme'; el.textContent = `${n0.format(val - rif)} km in una giornata: è giusto?`; }
    else if (rif) el.textContent = `Ultimo valore noto: ${n0.format(rif)} km` + (val > rif ? ` · ${n0.format(val - rif)} km percorsi` : '');
  }
  controllaKm();

  /* foto */
  if (v.passo === 3) {
    app().querySelectorAll('[data-ant]').forEach(async img => {
      const b = await anteprima(img.dataset.ant);
      if (b) img.src = URL.createObjectURL(b);
    });
    const inp = $('#scatta');
    const scatta = eti => { inp.onchange = async () => {
      const f = inp.files && inp.files[0]; inp.value = '';
      if (!f) return;
      const b = await riduci(f);
      const nome = `${g.rif}_${(eti || 'foto').toLowerCase().replace(/[^a-z0-9]+/g, '-')}_${Date.now().toString(36)}.jpg`;
      await spedisciFoto(g, nome, b, eti);
      passoGio(modo);
    }; inp.click(); };
    app().querySelectorAll('[data-slot]').forEach(b => b.onclick = () => scatta(b.dataset.eti));
    app().querySelector('[data-altra]').onclick = () => scatta('Altra');
  }

  d.querySelector('[data-avanti]').onclick = async () => {
    if (v.passo < tot) {
      if (v.passo === 1 && (g[kmK] === '' || g[kmK] == null) && g.targa) {
        if (!await conferma('Senza chilometri?', 'Il chilometraggio serve per i consumi e per i tagliandi. Vuoi continuare lo stesso?', 'Continua')) return;
      }
      v.passo++; return passoGio(modo);
    }
    const mancano = SLOT.filter(([, l]) => !(g.foto || []).some(f => f.eti === l)).length;
    if (mancano && !await conferma(`Mancano ${mancano} foto`,
      'Le foto servono a dimostrare lo stato del mezzo. Vuoi concludere lo stesso?', 'Concludi')) return;
    if (!ap) { g.stato = 'Chiusa'; if (!g.oraFine) g.oraFine = oraOra(); }
    const i = S.gio.findIndex(x => x.rif === g.rif);
    if (i >= 0) S.gio[i] = g; else S.gio.push(g);
    await spedisciGio(g);
    S.vista = null; S.tab = 'oggi'; disegna();
    avviso(ap ? 'Giornata aperta. Buon lavoro.' : 'Giornata chiusa.');
  };
}

/* ---------- segnalazione danno ---------- */
const PUNTI = ['Anteriore', 'Posteriore', 'Lato guida', 'Lato passeggero', 'Tetto', 'Interno'];
const TIPI = ['Urto', 'Graffio', 'Vetro', 'Pneumatico', 'Guasto meccanico', 'Altro'];
function vDanno() {
  const v = S.vista; v.d = v.d || { rif: uid(), punto: '', tipo: '', grave: false, note: '', foto: [] };
  const d = v.d;
  guscio('Segnala un danno', `
    <div class="campo"><label>Dove</label>
      <div class="tacche" style="flex-wrap:wrap">${PUNTI.map(p =>
        `<button data-p="${esc(p)}" class="${d.punto === p ? 'on' : ''}" style="flex:1 1 30%">${esc(p)}</button>`).join('')}</div></div>
    <div class="campo"><label>Che cosa</label>
      <div class="tacche" style="flex-wrap:wrap">${TIPI.map(t =>
        `<button data-ti="${esc(t)}" class="${d.tipo === t ? 'on' : ''}" style="flex:1 1 30%">${esc(t)}</button>`).join('')}</div></div>
    <div class="campo"><label>Gravità</label>
      <div class="tacche">${[['No', 'Il mezzo cammina'], ['Sì', 'Il mezzo è fermo']].map(([k, l]) =>
        `<button data-gr="${k}" class="${(d.grave ? 'Sì' : 'No') === k ? 'on' : ''}">${esc(l)}</button>`).join('')}</div></div>
    <div class="campo"><label>Note</label><textarea class="inp" rows="3" data-n>${esc(d.note)}</textarea></div>
    <div class="foto">${(d.foto || []).map(f => `<div class="scatto fatto"><img data-ant="${esc(f.file)}" alt=""></div>`).join('')}
      <button class="scatto" data-scatta>${ico('foto', 26)}<span>Foto del danno</span></button></div>
    <input type="file" accept="image/*" capture="environment" id="scatta" hidden>`,
    { indietro: true, senzaBarra: true });

  const pol = pollice('<button class="btn primo grande largo" data-inv>Invia la segnalazione</button>');

  app().querySelectorAll('[data-p]').forEach(b => b.onclick = () => { d.punto = b.dataset.p; vDanno(); });
  app().querySelectorAll('[data-ti]').forEach(b => b.onclick = () => { d.tipo = b.dataset.ti; vDanno(); });
  app().querySelectorAll('[data-gr]').forEach(b => b.onclick = () => { d.grave = b.dataset.gr === 'Sì'; vDanno(); });
  app().querySelector('[data-n]').oninput = e => d.note = e.target.value;
  app().querySelectorAll('[data-ant]').forEach(async img => {
    const b = await anteprima(img.dataset.ant); if (b) img.src = URL.createObjectURL(b);
  });
  const inp = $('#scatta');
  app().querySelector('[data-scatta]').onclick = () => { inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
    const b = await riduci(f);
    const nome = `${d.rif}_danno_${Date.now().toString(36)}.jpg`;
    d.foto.push({ file: nome });
    await DB.set('foto', 'anteprima:' + nome, b);
    await CODA.accoda('foto', { rif: d.rif, data: oggiISO(), file: nome, eti: 'Danno' }, b);
    vDanno();
  }; inp.click(); };

  pol.querySelector('[data-inv]').onclick = async () => {
    if (!d.punto || !d.tipo) return avviso('Indica dove e che cosa.', true);
    const g = v.g;
    const dato = {
      rif: d.rif, data: oggiISO(), targa: g ? g.targa : (mioMezzo() || {}).t || '',
      dipendente: (mioDip() || {}).c || '', punto: d.punto, tipo: d.tipo,
      grave: d.grave ? 'Sì' : 'No', note: d.note, foto: d.foto.map(f => f.file), origine: 'app',
    };
    S.seg.push(dato); await salvaSeg();
    await CODA.accoda('segnalazione', dato);
    if (g) { g.danni = 'Sì'; await salvaGio(); }
    avviso('Segnalazione inviata.' + (d.grave ? ' Il responsabile è stato avvisato.' : ''));
    if (v.torna) { S.vista = { n: v.torna, passo: 2, g, propKm: g.kmInizio }; } else S.vista = null;
    disegna();
  };
}

/* ---------- mezzi ---------- */
function vMezzi() {
  const l = mezziVisti();
  guscio('Mezzi', l.length ? `<div class="schede">${l.map(m => {
    const sc = (scadenze().filter(s => s.targa === m.t && (s.liv === 'scaduta' || s.liv === 'vicina')));
    return `<button class="scheda ${sc.some(s => s.liv === 'scaduta') ? 'err' : sc.length ? 'att' : ''}" data-mz="${esc(m.t)}">
      <span class="corpo"><span class="tit">${targa(m.t)}</span>
      <span class="sot">${esc(nomeMezzo(m))}</span>

        ${sc.length ? `<span style="color:var(--crit)"><b>${sc.length}</b> da gestire</span>` : ''}</span>
      </span><span class="frec">${ico('avanti', 20)}</span></button>`;
  }).join('')}</div>` : '<div class="vuoto">Nessun mezzo da mostrare.</div>');

function vMezzo() {
  const m = mezzo(S.vista.t);
  if (!m) { S.vista = null; return disegna(); }
  const sc = scadenze().filter(s => s.targa === m.t);
  const mie = S.gio.filter(g => g.targa === m.t).sort((a, b) => a.data < b.data ? 1 : -1).slice(0, 5);
  guscio(m.t, `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">${targa(m.t)}
      <span class="pil ${m.st === 'Disponibile' ? 'ok' : m.st === 'Fermo tecnico' ? 'crit' : ''}">${esc(m.st || '—')}</span></div>
    <h2 style="font-size:22px">${esc(nomeMezzo(m))}</h2>
    <p class="muto piccolo">${[m.tip, m.cdc, m.km != null ? n0.format(m.km) + ' km' : ''].filter(Boolean).map(esc).join(' · ')}</p>
    <h3 style="margin-top:22px">Scadenze</h3>
    ${sc.length ? `<div class="schede">${sc.map(s => `<div class="scheda ${s.liv === 'scaduta' ? 'err' : s.liv === 'vicina' ? 'att' : ''}">
      <span class="corpo"><span class="tit">${esc(s.titolo)}</span>
      <span class="dett"><span><b>${fmtD(s.data)}</b></span>
        <span>${s.giorni < 0 ? 'scaduta da ' + (-s.giorni) + ' giorni' : 'fra ' + s.giorni + ' giorni'}</span></span></span></div>`).join('')}</div>`
      : '<div class="vuoto">Nessuna scadenza registrata.</div>'}
    ${mie.length ? `<h3 style="margin-top:22px">Ultime giornate su questo mezzo</h3>
      <div class="schede">${mie.map(g => {
        const km = kmFatti(g);
        return `<div class="scheda"><span class="corpo"><span class="tit">${fmtD(g.data)}</span>
          <span class="dett"><span>${esc(g.stato)}</span>${km != null ? `<span><b>${n0.format(km)}</b> km</span>` : ''}</span></span></div>`;
      }).join('')}</div>` : ''}
  `, { indietro: true, senzaBarra: true });
}

/* ---------- scadenze ---------- */
function vScadenze() {
  const l = scadenze();
  guscio('Scadenze', l.length ? `<div class="schede">${l.map(s =>
    `<button class="scheda ${s.liv === 'scaduta' ? 'err' : s.liv === 'vicina' ? 'att' : ''}" data-mz="${esc(s.targa)}">
      <span class="corpo"><span class="tit">${esc(s.titolo)} ${targa(s.targa)}</span>
      <span class="dett"><span><b>${fmtD(s.data)}</b></span>
      <span>${s.giorni < 0 ? 'scaduta da ' + (-s.giorni) + ' gg' : 'fra ' + s.giorni + ' gg'}</span></span>
      </span><span class="frec">${ico('avanti', 20)}</span></button>`).join('')}</div>`
    : '<div class="vuoto">Nessuna scadenza. Tutto in regola.</div>', { indietro: true });
  app().querySelectorAll('[data-mz]').forEach(b => b.onclick = () => { S.vista = { n: 'mezzo', t: b.dataset.mz }; disegna(); });
  barra();
}

/* ---------- quadro del giorno ---------- */
function vGiornata() {
  const o = oggiISO();
  const dip = dipVisti();
  const righe = dip.map(d => ({ d, g: gioDi(d.c, o) }));
  guscio('Giornata di oggi', `
    <p class="muto piccolo">${new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <div class="riquadri">
      <button class="riq"><b>${righe.filter(r => r.g).length}</b><small>giornate aperte</small></button>
      <button class="riq ${righe.filter(r => !r.g).length ? 'avviso' : ''}"><b>${righe.filter(r => !r.g).length}</b><small>non ancora aperte</small></button>
    </div>
    ${righe.length ? `<div class="schede">${righe.map(({ d, g }) => `
      <div class="scheda ${g && g.danni === 'Sì' ? 'err' : g && gioAperta(g) ? 'att' : ''}">
        <span class="corpo"><span class="tit">${esc([d.co, d.no].filter(Boolean).join(' '))} ${g && g.targa ? targa(g.targa) : ''}</span>
        <span class="dett">${g ? `<span>${esc(g.stato)}</span><span>dalle <b>${esc(g.oraInizio || '—')}</b></span>`
          : '<span>nessuna giornaliera</span>'}</span></span></div>`).join('')}</div>`
      : '<div class="vuoto">Nessun dipendente in elenco.</div>'}
    <p class="piccolo muto" style="margin-top:16px">Qui vedi quello che i telefoni hanno già inviato.
    Il quadro completo, con le giornate aperte dalle altre postazioni, è nel gestionale.</p>`);
  barra();
}

/* ---------- officina ---------- */
function vOfficina() {
  const fermi = (I().mezzi || []).filter(m => m.st === 'Fermo tecnico');
  guscio('Officina', fermi.length ? `<h3>Veicoli fermi</h3><div class="schede">${fermi.map(m =>
    `<button class="scheda err" data-mz="${esc(m.t)}"><span class="corpo">
      <span class="tit">${targa(m.t)}</span><span class="sot">${esc(nomeMezzo(m))}</span></span>
      <span class="frec">${ico('avanti', 20)}</span></button>`).join('')}</div>`
    : '<div class="vuoto">Nessun veicolo fermo.</div>');
  app().querySelectorAll('[data-mz]').forEach(b => b.onclick = () => { S.vista = { n: 'mezzo', t: b.dataset.mz }; disegna(); });
  barra();
}

/* ---------- altro e impostazioni ---------- */
async function vAltro() {
  const st = await CODA.stato();
  const tema = (localStorage.getItem('mf-tema') || 'auto');
  foglio('', `
    <div style="padding:0 20px 10px"><div style="font-weight:650">${esc(S.io.nome || S.io.email)}</div>
      <div class="piccolo muto">${esc(S.io.email)} · ${esc((defRuolo() || {}).l || '')}${mioCdc() ? ' · ' + esc(mioCdc()) : ''}</div></div>
    <button class="voce" data-v="scadenze">${ico('scadenze', 20)}<span>Scadenze</span></button>
    <button class="voce" data-coda>${ico('nube', 20)}<span>Da inviare</span>
      <span class="pil ${st.totale ? 'att' : 'ok'}" style="margin-left:auto">${st.totale || 'tutto inviato'}</span></button>
    <div style="height:1px;background:var(--linea);margin:8px 0"></div>
    <h3 style="padding:8px 20px 4px">Aspetto</h3>
    ${[['auto', 'Come il telefono'], ['chiaro', 'Chiaro'], ['scuro', 'Scuro']].map(([k, l]) =>
      `<button class="voce ${tema === k ? 'on' : ''}" data-tema="${k}"><span>${esc(l)}</span>
        ${tema === k ? `<span style="margin-left:auto">${ico('spunta', 18)}</span>` : ''}</button>`).join('')}
    <div style="height:1px;background:var(--linea);margin:8px 0"></div>
    <button class="voce" data-agg>${ico('nube', 20)}<span>Aggiorna i dati della flotta</span></button>
    <button class="voce" data-esci>${ico('esci', 20)}<span>Esci dall’account</span></button>
    <div class="piccolo muto" style="padding:12px 20px 0">Matherion Flotta ${APP_VER}</div>`,
    (v, chiudi) => {
      v.querySelectorAll('[data-tema]').forEach(b => b.onclick = () => {
        const k = b.dataset.tema;
        try { k === 'auto' ? localStorage.removeItem('mf-tema') : localStorage.setItem('mf-tema', k); } catch (e) { }
        applicaTema(); disegna(); chiudi(); vAltro();
      });
      v.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { chiudi(); S.tab = b.dataset.v; disegna(); });
      v.querySelector('[data-coda]').onclick = () => { chiudi(); vCoda(); };
      v.querySelector('[data-agg]').onclick = async () => { chiudi(); await avvia(true); avviso('Dati aggiornati.'); };
      v.querySelector('[data-esci]').onclick = async () => {
        const st2 = await CODA.stato();
        if (st2.totale && !await conferma('Ci sono cose da inviare',
          `${st2.totale} operazioni non sono ancora partite. Uscendo restano sul telefono e partiranno al prossimo accesso.`, 'Esci lo stesso')) return;
        msEsci();
      };
    });
}
async function vCoda() {
  const l = await CODA.elenco();
  foglio('Da inviare', l.length ? l.map(o => `
    <div class="voce" style="align-items:flex-start">
      <div style="flex:1"><div style="font-weight:650">${o.tipo === 'foto' ? 'Foto' : o.tipo === 'giornaliera' ? 'Giornaliera' : 'Segnalazione'}
        ${o.dati && o.dati.data ? '· ' + fmtD(o.dati.data) : ''}</div>
        <div class="piccolo muto">${o.stato === 'bloccata' ? 'ferma: ' + esc(o.errore || '') : o.tentativi ? esc(o.tentativi) + ' tentativi' : 'in attesa'}</div></div>
    </div>`).join('') + `<div style="padding:12px 20px"><button class="btn primo largo" data-ora>Prova a inviare adesso</button></div>`
    : '<div class="vuoto" style="margin:0 20px">Niente in attesa: è tutto arrivato.</div>',
    (v, chiudi) => {
      const b = v.querySelector('[data-ora]');
      if (b) b.onclick = async () => { b.textContent = 'invio…'; await CODA.riprova(); chiudi(); vCoda(); disegna(); };
    });
}
function applicaTema() {
  let t = 'auto'; try { t = localStorage.getItem('mf-tema') || 'auto'; } catch (e) { }
  document.documentElement.dataset.tema = t;
  const scuro = t === 'scuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const mt = document.querySelector('meta[name=theme-color]');
  if (mt) mt.content = scuro ? '#0B0F10' : '#FFFFFF';
}

/* ============================================================
   AVVIO
   L'app deve aprirsi anche in un'autorimessa senza segnale: prima
   mostra quello che ha sul telefono, poi aggiorna se può.
   ============================================================ */
async function avvia(forzaIndice) {
  applicaTema();
  await caricaGio();
  S.indice = await indiceLocale();
  disegna();

  let dentro = false;
  try { dentro = await msAvvio(); } catch (e) { avviso('Accesso non riuscito: ' + e.message, true); }
  if (!dentro) return disegna();

  avviaCoda(DEPOSITO);
  CODA.su(() => { if (!S.vista) disegna(); });

  if (forzaIndice || !S.indice || Date.now() - (S.indice.scaricato || 0) > 3600e3) {
    try { S.indice = await scaricaIndice(); }
    catch (e) { if (!S.indice) avviso('Dati della flotta non scaricati: ' + e.message, true); }
  }
  disegna();
}

/* aggiorna l'indice quando l'app torna in primo piano, senza disturbare */
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !S.io || !msAttivo()) return;
  if (Date.now() - ((S.indice || {}).scaricato || 0) < 900e3) return;
  try { S.indice = await scaricaIndice(); disegna(); } catch (e) { }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applicaTema(); disegna(); });

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
}
avvia();

</script>
</body>
</html>
